# Configuración del servidor
server.port=8080

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# Documentación OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Habilitar la inicialización SQL
spring.sql.init.mode=always

# Ruta relativa desde la raíz del proyecto usando file:
spring.sql.init.schema-locations=file:database/ddl/01_schema_init.sql
spring.sql.init.data-locations=file:database/dml/01_seed_data.sql

spring.main.allow-bean-definition-overriding=true